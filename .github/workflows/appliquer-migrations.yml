name: Appliquer les migrations

# Les migrations vivent dans le depot mais s'appliquent chez Supabase, ce qui
# demandait jusqu'ici une machine avec le CLI et les identifiants sous la main.
#
# Ce workflow passe par l'API de gestion Supabase — celle qu'utilise l'editeur
# SQL du tableau de bord — plutot que par `supabase db push`. La raison est
# concrete : `db push` se connecte directement a Postgres et exige donc le mot
# de passe de la base, un secret de plus a deposer, alors que le jeton de compte
# existe deja dans ce depot.
#
# Deux precautions, parce qu'il ecrit dans une base de production :
#
#  1. le mode `inspecter` ne lit rien d'autre que la liste des tables et
#     l'historique des migrations. C'est le mode par defaut ;
#  2. `appliquer` n'ecrit que les quatre migrations de septembre. Les onze
#     precedentes ne sont jamais rejouees : elles sont deja en place, et les
#     repasser echouerait sur des objets existants.
#
# Secret requis : SUPABASE_ACCESS_TOKEN
# (https://supabase.com/dashboard/account/tokens)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspecter (lecture seule) ou appliquer (écrit dans la base)"
        required: true
        default: inspecter
        type: choice
        options:
          - inspecter
          - appliquer
          - contenu
          - reparer

env:
  PROJECT_REF: uckzkcphatmdmtibyhyk

jobs:
  migrer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Vérifier la présence du jeton
        env:
          JETON: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$JETON" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN absent. Voir l'en-tête de ce fichier."
            exit 1
          fi
          echo "Jeton présent."

      # Toujours joue, y compris avant d'appliquer : on veut savoir dans quel
      # etat est la base avant de la modifier, pas seulement apres.
      - name: Inspecter
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/appliquer-migrations.mjs inspecter

      # Les onze migrations de juillet et aout ont ete appliquees a la main,
      # sans historique. Les inscrire evite qu'un futur `supabase db push`
      # depuis une machine ne veuille les rejouer. Aucun schema n'est touche.
      - name: Réparer l'historique
        if: ${{ inputs.mode == 'reparer' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node scripts/appliquer-migrations.mjs reparer \
            $(ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1 | tr '\n' ' ')

      - name: Appliquer
        if: ${{ inputs.mode == 'appliquer' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node scripts/appliquer-migrations.mjs appliquer \
            supabase/migrations/20260903000000_socle_contenu.sql \
            supabase/migrations/20260903000100_socle_assistant.sql \
            supabase/migrations/20260903000200_regles_assurances.sql \
            supabase/migrations/20260903000300_contenu_cours.sql

      # Le fichier de contenu est le seul concu pour etre rejoue : il remplace
      # ses blocs. On le relance apres chaque correction du cours, sans toucher
      # aux migrations de schema.
      - name: Recharger le contenu du cours
        if: ${{ inputs.mode == 'contenu' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node scripts/appliquer-migrations.mjs rejouer \
            supabase/migrations/20260903000300_contenu_cours.sql

      - name: Vérifier le résultat
        if: ${{ inputs.mode != 'inspecter' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/appliquer-migrations.mjs inspecter
