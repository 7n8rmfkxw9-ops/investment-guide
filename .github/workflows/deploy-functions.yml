name: Deploy Edge Function

# Le frontend se republie tout seul a chaque push (deploy-pages.yml), mais les
# Edge Functions vivent chez Supabase et demandent un jeton d'acces personnel
# que le depot ne detient pas par defaut. Sans ce workflow, toute modification
# du code serveur exige une machine avec le CLI et le jeton sous la main — et
# une fonction non redeployee se traduit par un onglet qui repond « action
# inconnue » alors que le code est bien sur `main`.
#
# Declenchement manuel uniquement : deployer du code serveur a chaque commit
# n'est pas souhaitable, et un workflow automatique echouerait a chaque push
# tant que le secret n'existe pas.
#
# Prealable, une seule fois :
#   1. creer un jeton sur https://supabase.com/dashboard/account/tokens
#   2. le deposer dans Settings > Secrets and variables > Actions du depot,
#      sous le nom SUPABASE_ACCESS_TOKEN

on:
  workflow_dispatch:
    inputs:
      fonction:
        description: "Fonction à déployer"
        required: true
        default: cotations
        type: choice
        options:
          - cotations
          - journal
          - sync-edgar
          - sync-fsma
          - sync-fi

env:
  PROJECT_REF: uckzkcphatmdmtibyhyk

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Vérifier la présence du jeton
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN absent. Voir l'en-tête de ce fichier."
            exit 1
          fi

      # Une fonction n'est deployee que nommement : deployer tout d'un coup
      # toucherait aussi aux fonctions de synchronisation appelees par le cron,
      # qu'il n'y a aucune raison de redemarrer pour un changement de cotations.
      - name: Déployer ${{ inputs.fonction }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy "${{ inputs.fonction }}" --project-ref "$PROJECT_REF"
