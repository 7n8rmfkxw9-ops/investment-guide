name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Les calculs de frais et de change decident de ce que l'utilisateur
      # croit avoir gagne : ils ne partent pas sans verification.
      - run: npm test
